<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Erilang is a declarative, English-like programming language built for readability and accessibility — well suited to data science, backend services, and everyday scripting, and designed for programmers using screen readers, and for everyone else besides." />
    <title>Erilang — a readable, declarative programming language</title>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a2540;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 28px 28px;
        transition:
          opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          visibility 0.5s;
      }
      #app-loader.app-loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader__glow {
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(173, 223, 241, 0.35), transparent 70%);
        filter: blur(10px);
        animation: app-loader-pulse 2.2s ease-in-out infinite;
      }
      #app-loader__mark {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #app-loader__logo {
        height: 56px;
        width: auto;
        animation: app-loader-breathe 2.2s ease-in-out infinite;
      }
      #app-loader__ring {
        width: 30px;
        height: 30px;
        border-radius: 9999px;
        border: 2.5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #addff1;
        animation: app-loader-spin 0.9s linear infinite;
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
      @keyframes app-loader-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader__glow,
        #app-loader__logo,
        #app-loader__ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader">
      <div id="app-loader__glow" aria-hidden="true"></div>
      <div id="app-loader__mark">
        <img id="app-loader__logo" src="/erilang-logo-reversed.svg" alt="" />
        <div id="app-loader__ring" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
